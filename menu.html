<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1020">
<title>Cocktail Menu</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500&family=Josefin+Sans:wght@400;600;700&display=swap">
<style>
  :root { --bg:#1b1020; --text:#f4ece0; --muted:#bba9b8; --gold:#d4b25c; --line:#4a3052; --panel:#26162c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Inter",-apple-system,system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:calc(36px + env(safe-area-inset-top)) 20px 60px; text-align:center; }
  h1 { font-family:"Cormorant Garamond",Georgia,serif; color:var(--gold); font-size:2.4rem; font-weight:600; letter-spacing:.06em; margin:0; }
  .orn { color:var(--gold); opacity:.7; margin:6px 0 26px; letter-spacing:.4em; }
  .back { position:sticky; top:0; z-index:5; display:block; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; width:100%; background:var(--bg, #1b1020); color:var(--gold); border:0; border-bottom:1px solid var(--line); font:inherit; font-size:1rem; text-align:left; cursor:pointer; }
  .hint { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  button.drink { display:block; width:100%; background:none; border:0; border-top:1px solid var(--line); color:inherit; padding:18px 6px; cursor:pointer; text-align:center; font:inherit; }
  button.drink:last-of-type { border-bottom:1px solid var(--line); }
  .drink b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.6rem; font-weight:600; }
  .drink span { color:var(--muted); font-size:.95rem; }
  .drink.soft b { font-size:1.3rem; }
  .sec { font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:26px 0 6px; text-align:center; }
  .drink .zp { display:table; margin-left:auto !important; margin-right:auto !important; font-style:normal; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:1px 8px; margin:2px 0 6px; }
  .pick { position:fixed; inset:0; background:rgba(10,5,12,.92); display:flex; align-items:center; justify-content:center; padding:24px; }
  .pick[hidden] { display:none; }
  .pick div { background:var(--panel); border:1px solid var(--gold); border-radius:18px; padding:28px 22px; max-width:420px; width:100%; }
  .pick b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:2.2rem; color:var(--gold); margin:6px 0 10px; }
  .btn { display:inline-block; margin:8px 4px 0; padding:11px 18px; border-radius:12px; border:1px solid var(--gold); background:var(--gold); color:#1b1020; font-weight:600; font:inherit; cursor:pointer; }
  .btn.ghost { background:none; color:var(--gold); }
  .course { border-top:1px solid var(--line); padding:18px 6px; }
  .course:last-of-type { border-bottom:1px solid var(--line); }
  .course .cname { color:var(--gold); font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
  .course b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.5rem; font-weight:600; margin-bottom:6px; }
  .course span { display:block; color:var(--muted); font-size:.95rem; }
  .err { color:var(--muted); margin-top:40px; }
  /* Art deco dress: a framed card, a sunburst crest, diamond rules between sections */
  html { background:var(--bg); }
  body { background: radial-gradient(ellipse 120% 600px at top, #2d1834 0%, var(--bg) 100%) no-repeat, var(--bg); min-height:100vh; padding:1px 0; }
  main { position:relative; margin:22px max(16px, calc((100% - 540px) / 2)) 30px; border:1px solid var(--gold); outline:1px solid rgba(212,178,92,.35); outline-offset:6px; border-radius:4px; padding:calc(30px + env(safe-area-inset-top)) 22px 40px; max-width:540px; }
  main::before, main::after { content:"◆"; position:absolute; left:50%; transform:translateX(-50%); color:var(--gold); background:var(--bg); padding:0 10px; font-size:.8rem; }
  main::before { top:-.65rem; } main::after { bottom:-.65rem; }
  .fan { display:block; width:110px; margin:0 auto 10px; color:var(--gold); opacity:.85; }
  .rule { display:block; width:220px; max-width:70%; margin:10px auto 22px; color:var(--gold); opacity:.8; }
  .dot { display:block; width:14px; margin:0 auto; color:var(--gold); opacity:.6; }
  h1 { font-size:2.6rem; text-transform:uppercase; letter-spacing:.12em; }
  .sec { display:flex; align-items:center; gap:12px; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.05rem; letter-spacing:.3em; margin:30px 0 4px; }
  .sec::before, .sec::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .sec::after { background:linear-gradient(90deg, var(--gold), transparent); }
  button.drink, button.drink:last-of-type, .course, .course:last-of-type { border:0; }
  button.drink { padding:14px 6px 10px; }
  .drink b { font-size:1.7rem; letter-spacing:.02em; }
  .drink span { font-style:italic; }
  .kick { font-size:.72rem; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin:0 0 6px; }
  .host { font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; font-size:1.25rem; color:var(--muted); margin:8px 0 0; }
  .date { font-family:"Cormorant Garamond",Georgia,serif; font-size:1.6rem; font-weight:600; margin:0 0 6px; }
  .stop { padding:14px 4px 6px; }
  .stop .time { color:var(--gold); font-size:.85rem; letter-spacing:.2em; font-weight:500; }
  .stop b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.45rem; font-weight:600; margin:4px 0; }
  .stop span { display:block; color:var(--muted); font-size:.95rem; }
  .links { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:10px; }
  a.btn, .btn.small { text-decoration:none; font-size:.9rem; padding:8px 14px; margin:0; }
  .note { color:var(--muted); font-size:.95rem; margin:10px 0 0; }
  .give { border:1px solid var(--line); border-radius:12px; padding:16px 14px; margin:22px 0 4px; }
  .give b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.35rem; color:var(--gold); margin-bottom:6px; }
  .give p { color:var(--muted); margin:0 0 12px; font-size:.95rem; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:20px 0 4px; }
  .food { padding:12px 6px 8px; }
  .food b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.45rem; font-weight:600; }
  .food span { color:var(--muted); font-size:.95rem; font-style:italic; }
  .pick input { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; margin:6px 0 4px; }
  .pick .stack { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .pick .stack .btn { margin:0; }
  /* Mid-century modern holiday look, used by party invites */
  body.mcm { --ink:#2a2723; --teal:#2f7d74; --red:#c8432b; --mus:#e2a52a; --olive:#6f8a3a; --cream:#f6eedb; --paper:#fffaf0; --soft:#6b6355;
    background:var(--cream); color:var(--ink); }
  html:has(body.mcm) { background:#f6eedb; }
  .mcm main { background:var(--paper); border:3px solid var(--teal); outline:0; border-radius:24px; box-shadow:8px 8px 0 var(--mus); }
  .mcm main::before, .mcm main::after { content:none; }
  .mcm .mtree { display:block; width:150px; margin:0 auto 8px; }
  .mcm .mrule { display:block; width:220px; max-width:70%; margin:14px auto 20px; }
  .mcm .mdot { display:block; width:14px; margin:4px auto; }
  .mcm h1 { font-family:"Josefin Sans",system-ui,sans-serif; font-weight:700; color:var(--teal); font-size:2.3rem; letter-spacing:.08em; line-height:1.1; }
  .mcm .kick { font-family:"Josefin Sans",system-ui,sans-serif; font-weight:700; color:var(--red); letter-spacing:.32em; font-size:.8rem; }
  .mcm .host { font-family:"Josefin Sans",system-ui,sans-serif; font-style:normal; color:var(--soft); font-size:1.05rem; letter-spacing:.06em; }
  .mcm .date { font-family:"Josefin Sans",system-ui,sans-serif; font-weight:600; font-size:1.45rem; color:var(--ink); }
  .mcm .stop .time { display:inline-block; background:var(--red); color:var(--paper); border-radius:999px; padding:4px 12px 2px; font-family:"Josefin Sans",system-ui,sans-serif; font-weight:700; letter-spacing:.14em; }
  .mcm .stop b, .mcm .food b, .mcm .drink b { font-family:"Josefin Sans",system-ui,sans-serif; font-weight:600; color:var(--ink); font-size:1.25rem; letter-spacing:.01em; }
  .mcm .stop span, .mcm .note, .mcm .hint, .mcm .food span, .mcm .drink span { color:var(--soft); }
  .mcm .note a { color:var(--teal); font-weight:600; }
  .mcm .btn { background:var(--teal); border-color:var(--teal); color:var(--paper); border-radius:999px; font-weight:600; }
  .mcm .btn.ghost { background:transparent; color:var(--teal); }
  .mcm .give { background:#fdf1d6; border:2px dashed var(--mus); border-radius:18px; }
  .mcm .give b { font-family:"Josefin Sans",system-ui,sans-serif; font-weight:700; color:var(--red); font-size:1.15rem; }
  .mcm .give p { color:var(--soft); }
  .mcm .sec { font-family:"Josefin Sans",system-ui,sans-serif; font-weight:700; color:var(--red); font-size:.85rem; letter-spacing:.24em; }
  .mcm .sec::before { background:linear-gradient(90deg, transparent, var(--teal)); }
  .mcm .sec::after { background:linear-gradient(90deg, var(--teal), transparent); }
  .mcm .drink .zp { color:var(--teal); border-color:var(--teal); }
  .mcm .cheers { font-family:"Josefin Sans",system-ui,sans-serif; font-style:normal; font-weight:700; color:var(--red); letter-spacing:.12em; text-transform:uppercase; font-size:1rem; }
  .mcm .back { background:var(--cream); color:var(--teal); border-bottom-color:#e4d6b8; }
  .mcm .pick { background:rgba(42,39,35,.55); }
  .mcm .pick div { background:var(--paper); border:3px solid var(--teal); }
  .mcm .pick b { font-family:"Josefin Sans",system-ui,sans-serif; color:var(--teal); }
  .mcm .pick .hint { color:var(--soft); }
  .mcm .pick input { background:#fff; color:var(--ink); border-color:#d9cba9; }
  .mcm .rides { margin-top:10px; font-size:.95rem; color:var(--soft); }
  .mcm .rides span { display:block; font-family:"Josefin Sans",system-ui,sans-serif; font-weight:700; font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; color:var(--red); margin-bottom:6px; }
  .mcm .rides a { display:inline-block; margin:0 5px; padding:6px 14px; border-radius:999px; background:#fdf1d6; border:1.5px solid var(--mus); color:var(--ink); font-weight:600; text-decoration:none; }
  .links .btn { font-family:inherit; font-size:.9rem; font-weight:600; line-height:1.2; padding:8px 14px; margin:0; }
  .cheers { font-family:"Cormorant Garamond",Georgia,serif; color:var(--gold); font-style:italic; font-size:1.2rem; margin-top:26px; opacity:.9; }
</style>
</head>
<body>
<button class="back" id="backApp" hidden>‹ Back to my app</button>
<main id="m"><p class="err">Loading menu…</p></main>
<div class="pick" id="rsvp" hidden><div><span class="hint">RSVP</span><b id="rsvpTitle"></b>
  <label class="hint" for="rsvpName">Your name</label><input id="rsvpName" autocomplete="name" placeholder="First and last name">
  <p class="stack"><button class="btn" data-rsvp="yes">Count me in</button><button class="btn ghost" data-rsvp="no">Sorry, I can’t make it</button><button class="btn ghost" id="rsvpBack">Back</button></p></div></div>
<div class="pick" id="pick" hidden><div><span class="hint">Your pick</span><b id="pickName"></b><p class="hint">Show this to your host.</p>
  <button class="btn" id="tell">Text my pick</button><button class="btn ghost" id="back">Back to menu</button></div></div>
<script>
(async function () {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const m = document.getElementById('m');
  const FAN = '<svg class="fan" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><line x1="60" y1="56" x2="106.4" y2="43.6"/><line x1="60" y1="56" x2="101.6" y2="32.0"/><line x1="60" y1="56" x2="93.9" y2="22.1"/><line x1="60" y1="56" x2="84.0" y2="14.4"/><line x1="60" y1="56" x2="72.4" y2="9.6"/><line x1="60" y1="56" x2="60.0" y2="8.0"/><line x1="60" y1="56" x2="47.6" y2="9.6"/><line x1="60" y1="56" x2="36.0" y2="14.4"/><line x1="60" y1="56" x2="26.1" y2="22.1"/><line x1="60" y1="56" x2="18.4" y2="32.0"/><line x1="60" y1="56" x2="13.6" y2="43.6"/><path d="M8 56 A52 52 0 0 1 112 56"/><path d="M24 56 A36 36 0 0 1 96 56"/></g><circle cx="60" cy="56" r="4" fill="currentColor"/></svg>';
  const RULE = '<svg class="rule" viewBox="0 0 240 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="8" x2="96" y2="8"/><line x1="144" y1="8" x2="240" y2="8"/><path d="M104 8 L110 2 L116 8 L110 14 Z"/><path d="M124 8 L130 2 L136 8 L130 14 Z"/></g><circle cx="120" cy="8" r="2.5" fill="currentColor"/></svg>';
  const DOT = '<svg class="dot" viewBox="0 0 20 10" aria-hidden="true"><path d="M10 0 L13 5 L10 10 L7 5 Z" fill="currentColor"/></svg>';
  // Mid-century holiday trim for party invites: a stacked tree, atomic starbursts
  // RT in a Santa hat, drawn from a photo
  const MCM_TREE = '<svg class="mtree" viewBox="0 0 160 170" role="img" aria-label="RT in a Santa hat"><g stroke="#2a2723" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M48,72 Q40,58 28,62 Q19,64 21,72 Q13,77 19,84 Q14,92 24,95 Q28,103 40,96 Z" fill="#4f4d49"/><path d="M112,72 Q120,58 132,62 Q141,64 139,72 Q147,77 141,84 Q146,92 136,95 Q132,103 120,96 Z" fill="#4f4d49"/><path d="M44,72 L40,84 L36,90 L40,96 L35,104 L40,110 L37,118 L44,124 L42,132 L50,136 L52,144 L60,145 L64,152 L71,149 L76,156 L80,151 L84,156 L89,149 L96,152 L100,145 L108,144 L110,136 L118,132 L116,124 L123,118 L120,110 L125,104 L120,96 L124,90 L120,84 L116,72 Z" fill="#fffaf0"/></g><path d="M44,98 Q50,84 64,88 Q56,96 54,112 Q50,122 46,118 Z" fill="#e2a52a" opacity=".55"/><path d="M116,98 Q110,84 96,88 Q104,96 106,112 Q110,122 114,118 Z" fill="#e2a52a" opacity=".55"/><path d="M62,74 Q70,84 80,80 Q90,84 98,74 Z" fill="#8a8781" opacity=".55"/><ellipse cx="64" cy="99" rx="7.5" ry="8" fill="#2a2723"/><ellipse cx="96" cy="99" rx="7.5" ry="8" fill="#2a2723"/><circle cx="66.6" cy="96" r="2.4" fill="#fff"/><circle cx="98.6" cy="96" r="2.4" fill="#fff"/><g stroke="#6b6863" stroke-width="1.4" stroke-linecap="round" fill="none"><path d="M56,90 Q63,86 71,89 M104,90 Q97,86 89,89"/></g><path d="M69,116 Q80,109 91,116 Q91,125 80,128 Q69,125 69,116 Z" fill="#2a2723"/><ellipse cx="76" cy="115" rx="3.4" ry="1.5" fill="#fff" opacity=".6"/><g stroke="#2a2723" stroke-width="2" stroke-linecap="round" fill="none"><path d="M80,128 L80,133 M73,135 Q80,139 87,135"/></g><g stroke="#6b6863" stroke-width="1.4" stroke-linecap="round" fill="none"><path d="M67,122 Q60,130 58,140 M63,119 Q55,124 51,132 M93,122 Q100,130 102,140 M97,119 Q105,124 109,132 M74,140 L72,147 M86,140 L88,147"/></g><g stroke="#2a2723" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M46,62 C52,32 80,14 104,18 C118,20 127,30 129,42 C119,33 106,35 100,43 C110,49 114,55 114,62 Z" fill="#c8432b"/><path d="M40,66 Q44,56 52,60 Q58,54 66,59 Q73,53 80,58 Q87,53 94,59 Q102,54 108,60 Q116,56 120,66 Q122,76 112,76 Q104,80 96,76 Q88,80 80,76 Q72,80 64,76 Q56,80 48,76 Q38,76 40,66 Z" fill="#fffaf0"/><circle cx="130" cy="47" r="8.5" fill="#fffaf0"/></g></svg>';
  const MCM_RULE = '<svg class="mrule" viewBox="0 0 240 24" aria-hidden="true"><g stroke="#2f7d74" stroke-width="1.6" stroke-linecap="round"><line x1="6" y1="12" x2="96" y2="12"/><line x1="144" y1="12" x2="234" y2="12"/></g><circle cx="104" cy="12" r="2.6" fill="#c8432b"/><circle cx="136" cy="12" r="2.6" fill="#c8432b"/><g stroke="#e2a52a" stroke-width="1.6" stroke-linecap="round"><line x1="122.5" y1="12.0" x2="130.0" y2="12.0"/><line x1="121.0" y1="13.0" x2="123.9" y2="15.9"/><line x1="120.0" y1="14.5" x2="120.0" y2="22.0"/><line x1="119.0" y1="13.0" x2="116.1" y2="15.9"/><line x1="117.5" y1="12.0" x2="110.0" y2="12.0"/><line x1="119.0" y1="11.0" x2="116.1" y2="8.1"/><line x1="120.0" y1="9.5" x2="120.0" y2="2.0"/><line x1="121.0" y1="11.0" x2="123.9" y2="8.1"/></g><circle cx="120" cy="12" r="1.5" fill="#e2a52a"/></svg>';
  const MCM_DOT = '<svg class="mdot" viewBox="0 0 20 20" aria-hidden="true"><g stroke="#e2a52a" stroke-width="1.4" stroke-linecap="round"><line x1="12.0" y1="10.0" x2="18.0" y2="10.0"/><line x1="10.8" y1="10.8" x2="13.1" y2="13.1"/><line x1="10.0" y1="12.0" x2="10.0" y2="18.0"/><line x1="9.2" y1="10.8" x2="6.9" y2="13.1"/><line x1="8.0" y1="10.0" x2="2.0" y2="10.0"/><line x1="9.2" y1="9.2" x2="6.9" y2="6.9"/><line x1="10.0" y1="8.0" x2="10.0" y2="2.0"/><line x1="10.8" y1="9.2" x2="13.1" y2="6.9"/></g><circle cx="10" cy="10" r="1.5" fill="#e2a52a"/></svg>';
  const fmtTime = (t) => { const x = /^(\d{1,2}):(\d{2})$/.exec(t || ''); if (!x) return t || ''; const h = +x[1]; return `${h % 12 || 12}:${x[2]} ${h < 12 ? 'AM' : 'PM'}`; };
  const ymd = (d) => /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
  const fmtDate = (d) => { const x = ymd(d); return x ? new Date(+x[1], x[2] - 1, +x[3]).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) : ''; };
  const iOS = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
  // Google Maps on every phone. It opens the Google Maps app when it's installed.
  const fmtPhone = (p) => { const x = String(p).replace(/\D/g, '').replace(/^1(?=\d{10}$)/, ''); return x.length === 10 ? `${x.slice(0, 3)}-${x.slice(3, 6)}-${x.slice(6)}` : p; };
  const mapUrl = (a) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a);
  // Uber takes the address. Lyft and Waymo open their app or site, and guests paste the copied address.
  const LYFT = 'https://lyft.com/ride?id=lyft', WAYMO = 'https://waymo.com/';
  const uberUrl = (a) => 'https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[formatted_address]=' + encodeURIComponent(a);
  function party(data) {
    document.title = data.t + ' · Invite';
    document.body.classList.add('mcm');
    document.querySelector('meta[name=theme-color]').content = '#f6eedb';
    const FAN = MCM_TREE, RULE = MCM_RULE, DOT = MCM_DOT;
    const stops = data.st || [], fh = data.fh || ['Bites', 'Sweets', 'Cocktails'];
    const foods = (sweet) => (data.f || []).filter(([s]) => !!s === sweet);
    const list = (head, rows) => (rows.length ? `<div class="sec">${esc(head)}</div>` + rows.join('') : '');
    const food = (rows) => rows.map(([, n, d], i) => `${i ? DOT : ''}<div class="food"><b>${esc(n)}</b>${d ? `<span>${esc(d)}</span>` : ''}</div>`);
    const drink = (rows) => rows.map(([n, d, z], i) => `${i ? DOT : ''}<button class="drink" data-name="${esc(n)}"><b>${esc(n)}</b>${z ? '<em class="zp">zero proof</em>' : ''}<span>${esc(d)}</span></button>`);
    const d = data.d || [];
    m.innerHTML = `${FAN}<p class="kick">You’re invited</p><h1>${esc(data.t)}</h1>${data.h ? `<p class="host">Hosted by ${esc(data.h)}</p>` : ''}${RULE}
      ${data.dt ? `<p class="date">${esc(fmtDate(data.dt))}</p>` : ''}
      ${stops.map(([t, what, place, addr], i) => `${i ? DOT : ''}<div class="stop">${t ? `<div class="time">${esc(fmtTime(t))}</div>` : ''}${what ? `<b>${esc(what)}</b>` : ''}${place ? `<span>${esc(place)}</span>` : ''}${addr ? `<span>${esc(addr)}</span><div class="links"><a class="btn ghost" href="${esc(mapUrl(addr))}" target="_blank" rel="noopener">Google Maps</a><button class="btn ghost" data-copy="${esc(addr)}">Copy address</button></div><div class="rides"><span>Rideshare</span><a href="${esc(uberUrl(addr))}" target="_blank" rel="noopener">Uber</a><a href="${LYFT}" target="_blank" rel="noopener">Lyft</a><a href="${WAYMO}" target="_blank" rel="noopener">Waymo</a></div>` : ''}</div>`).join('')}
      ${data.go ? `<p class="note">${esc(data.go)}</p>` : ''}
      <div class="actions"><button class="btn" id="rsvpBtn">RSVP</button>${ymd(data.dt) && stops[0] && stops[0][0] ? '<button class="btn ghost" id="calBtn">Add to my calendar</button>' : ''}</div>
      ${data.rs ? `<p class="note">or text <a href="sms:${esc(data.rs)}">${esc(fmtPhone(data.rs))}</a></p>` : ''}
      ${data.rb ? `<p class="note">Please RSVP by ${esc(data.rb)}</p>` : ''}
      ${data.gv ? `<div class="give"><b>${esc(data.gv[0])}</b><p>${esc(data.gv[1])}</p><a class="btn" href="${esc(data.gv[2])}" target="_blank" rel="noopener">${esc(data.gv[3])}</a></div>` : ''}
      ${(data.f || []).length || d.length ? `${RULE}<p class="kick">The menu</p>` : ''}
      ${list(fh[0], food(foods(false)))}${list(fh[1], food(foods(true)))}
      ${list(fh[2], drink(d.filter((x) => !x[2])))}${list('Zero proof', drink(d.filter((x) => x[2])))}
      ${d.length ? '<p class="hint" style="margin-top:14px">Place your order with the bartender.</p>' : ''}
      ${RULE}<div class="cheers">See you there</div>`;
    m.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; } catch (e) { b.textContent = b.dataset.copy; }
      setTimeout(() => { b.textContent = 'Copy address'; }, 2000);
    }));
    // Picking a drink, same as the cocktail menu
    const pick = document.getElementById('pick');
    let chosen = '';
    m.querySelectorAll('.drink').forEach((b) => b.addEventListener('click', () => { chosen = b.dataset.name; document.getElementById('pickName').textContent = chosen; pick.hidden = false; }));
    document.getElementById('back').onclick = () => { pick.hidden = true; };
    document.getElementById('tell').onclick = async () => {
      const text = `I'd love ${/^[aeiou]/i.test(chosen) ? 'an' : 'a'} ${chosen}, please!`;
      try { if (navigator.share) return await navigator.share({ text }); } catch (e) { return; }
      location.href = 'sms:?&body=' + encodeURIComponent(text);
    };
    // RSVP goes out as a text from the guest's own phone
    const rs = document.getElementById('rsvp'), nameIn = document.getElementById('rsvpName');
    try { nameIn.value = localStorage.getItem('al-rsvp-name') || ''; } catch (e) { /* private mode */ }
    document.getElementById('rsvpTitle').textContent = data.t;
    document.getElementById('rsvpBtn').onclick = () => { rs.hidden = false; };
    document.getElementById('rsvpBack').onclick = () => { rs.hidden = true; };
    rs.querySelectorAll('[data-rsvp]').forEach((b) => b.addEventListener('click', async () => {
      const who = nameIn.value.trim();
      if (!who) { nameIn.focus(); nameIn.placeholder = 'Please type your name first'; return; }
      try { localStorage.setItem('al-rsvp-name', who); } catch (e) { /* private mode */ }
      const hi = data.h ? `Hi ${data.h}, it’s ${who}.` : `Hi, it’s ${who}.`;
      const when = data.dt ? ` on ${fmtDate(data.dt)}` : '';
      const text = b.dataset.rsvp === 'yes' ? `${hi} Count me in for the ${data.t}${when}!` : `${hi} I’m sorry, I can’t make the ${data.t}${when}.`;
      if (data.rs) { location.href = `sms:${data.rs}${iOS ? '&' : '?'}body=${encodeURIComponent(text)}`; return; }
      try { if (navigator.share) return await navigator.share({ text }); } catch (e) { return; }
      location.href = 'sms:?&body=' + encodeURIComponent(text);
    }));
    // A calendar file for the whole evening, from the first stop to the last one
    const cal = document.getElementById('calBtn');
    if (cal) cal.onclick = () => {
      const x = ymd(data.dt), day = x[1] + x[2] + x[3];
      const t = (s) => { const y = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return y ? `${day}T${y[1].padStart(2, '0')}${y[2]}00` : ''; };
      const start = t(stops[0][0]);
      const lastT = t(stops[stops.length - 1][0]);
      const end = lastT && lastT > start ? lastT : start.replace(/T(\d{2})/, (_, h) => `T${String(Math.min(23, +h + 3)).padStart(2, '0')}`);
      const ic = (s) => String(s || '').replace(/[\\,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
      const desc = stops.map(([tm, what, place, addr]) => [fmtTime(tm), what, place, addr].filter(Boolean).join(', ')).concat(data.go ? [data.go] : []).join('\n') + '\n\n' + location.href;
      const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Artemis Lounge//Party//EN', 'BEGIN:VEVENT', `UID:${day}-${Math.random().toString(36).slice(2)}@artemis-lounge`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`, `DTSTART:${start}`, `DTEND:${end}`, `SUMMARY:${ic(data.t)}`,
        `LOCATION:${ic(stops[0][3] || stops[0][2])}`, `DESCRIPTION:${ic(desc)}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
      a.download = data.t.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-') + '.ics';
      document.body.appendChild(a); a.click(); a.remove();
    };
  }
  try {
    // The host's preview, or the menu opened inside the installed app, gets a way back.
    // Guests who scan the QR in their browser never see it.
    const inApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (inApp || new URLSearchParams(location.search).has('preview')) {
      const bk = document.getElementById('backApp'); bk.hidden = false;
      bk.onclick = () => { if (history.length > 1) history.back(); else location.href = './'; };
    }
    const raw = location.hash.slice(1);
    const kind = raw[0];
    const b64 = raw.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    let bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    if (kind === 'z') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    const data = JSON.parse(new TextDecoder().decode(bytes));
    if (data.k === 'party') {
      // Short links name a preset and built-in drinks by id. The recipe files fill them in.
      if (data.p || (data.d || []).some((x) => typeof x === 'string')) {
        const load = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
        await load('data.js'); await load('extras.js');
        const pr = data.p && (window.AL_PARTY_PRESETS || []).find((x) => x.id === data.p);
        if (data.p && !pr) throw new Error('unknown party');
        const full = Object.assign(pr ? window.AL_partyGuest(pr.party) : {}, data);
        full.d = (data.d || []).map((x) => { if (typeof x !== 'string') return x; const r = window.AL_RECIPES.find((y) => y.id === x); return r ? [r.name, r.guest || '', r.zeroProof ? 1 : 0] : null; }).filter(Boolean);
        return party(full);
      }
      return party(data);
    }
    if (data.k === 'dinner') {
      document.title = data.t + ' · Dinner Menu';
      m.innerHTML = `${FAN}<h1>${esc(data.t)}</h1>${RULE}` +
        data.c.map(([course, dish, pours], i) => `${i ? DOT : ''}<div class="course"><div class="cname">${esc(course)}</div>${dish ? `<b>${esc(dish)}</b>` : ''}${pours.map((x) => `<span>${esc(x)}</span>`).join('')}</div>`).join('') + `${RULE}<div class="cheers">Cheers</div>`;
      return;
    }
    document.title = data.t + ' · Cocktail Menu';
    m.innerHTML = `${FAN}<h1>${esc(data.t)}</h1>${RULE}<p class="hint">Tap a drink to choose it.</p>` +
      data.d.map(([n, d, z, st], i) => {
        // Section headings follow the order drinks are served, when the link has them
        const head = data.s && st != null && (i === 0 || data.d[i - 1][3] !== st) ? `<div class="sec">${esc(data.s[st])}</div>` : '';
        const dot = !head && i ? DOT : '';
        return `${head}${dot}<button class="drink" data-i="${i}"><b>${esc(n)}</b>${z ? '<em class="zp">zero proof</em>' : ''}<span>${esc(d)}</span></button>`;
      }).join('') +
      (data.n && data.n.length ? `<div class="sec">Also available</div>` + data.n.map((n, i) => `${i ? DOT : ''}<button class="drink soft" data-n="${esc(n)}"><b>${esc(n)}</b></button>`).join('') : '') +
      `${RULE}<div class="cheers">Cheers</div>`;
    const pick = document.getElementById('pick');
    let chosen = '';
    m.querySelectorAll('.drink').forEach((b) => b.addEventListener('click', () => {
      chosen = b.dataset.n || data.d[b.dataset.i][0];
      document.getElementById('pickName').textContent = chosen;
      pick.hidden = false;
    }));
    document.getElementById('back').onclick = () => { pick.hidden = true; };
    document.getElementById('tell').onclick = async () => {
      const text = `I'd love ${/^[aeiou]/i.test(chosen) ? 'an' : 'a'} ${chosen}, please!`;
      try { if (navigator.share) return await navigator.share({ text }); } catch (e) { return; }
      location.href = 'sms:?&body=' + encodeURIComponent(text);
    };
  } catch (e) {
    m.innerHTML = '<h1>Cocktail Menu</h1><p class="err">This menu link looks incomplete. Ask your host to send it again.</p>';
  }
})();
</script>
</body>
</html>
