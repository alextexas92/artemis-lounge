<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1020">
<title>Cocktail Menu</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500&display=swap">
<style>
  :root { --bg:#1b1020; --text:#f4ece0; --muted:#bba9b8; --gold:#d4b25c; --line:#4a3052; --panel:#26162c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Inter",-apple-system,system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:calc(36px + env(safe-area-inset-top)) 20px 60px; text-align:center; }
  h1 { font-family:"Cormorant Garamond",Georgia,serif; color:var(--gold); font-size:2.4rem; font-weight:600; letter-spacing:.06em; margin:0; }
  .orn { color:var(--gold); opacity:.7; margin:6px 0 26px; letter-spacing:.4em; }
  .hint { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  button.drink { display:block; width:100%; background:none; border:0; border-top:1px solid var(--line); color:inherit; padding:18px 6px; cursor:pointer; text-align:center; font:inherit; }
  button.drink:last-of-type { border-bottom:1px solid var(--line); }
  .drink b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.6rem; font-weight:600; }
  .drink span { color:var(--muted); font-size:.95rem; }
  .drink .zp { display:table; margin-left:auto !important; margin-right:auto !important; font-style:normal; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:1px 8px; margin:2px 0 6px; }
  .pick { position:fixed; inset:0; background:rgba(10,5,12,.92); display:flex; align-items:center; justify-content:center; padding:24px; }
  .pick[hidden] { display:none; }
  .pick div { background:var(--panel); border:1px solid var(--gold); border-radius:18px; padding:28px 22px; max-width:420px; width:100%; }
  .pick b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:2.2rem; color:var(--gold); margin:6px 0 10px; }
  .btn { display:inline-block; margin:8px 4px 0; padding:11px 18px; border-radius:12px; border:1px solid var(--gold); background:var(--gold); color:#1b1020; font-weight:600; font:inherit; cursor:pointer; }
  .btn.ghost { background:none; color:var(--gold); }
  .course { border-top:1px solid var(--line); padding:18px 6px; }
  .course:last-of-type { border-bottom:1px solid var(--line); }
  .course .cname { color:var(--gold); font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
  .course b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.5rem; font-weight:600; margin-bottom:6px; }
  .course span { display:block; color:var(--muted); font-size:.95rem; }
  .err { color:var(--muted); margin-top:40px; }
</style>
</head>
<body>
<main id="m"><p class="err">Loading menu…</p></main>
<div class="pick" id="pick" hidden><div><span class="hint">Your pick</span><b id="pickName"></b><p class="hint">Show this to your host.</p>
  <button class="btn" id="tell">Text my pick</button><button class="btn ghost" id="back">Back to menu</button></div></div>
<script>
(async function () {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const m = document.getElementById('m');
  try {
    const raw = location.hash.slice(1);
    const kind = raw[0];
    const b64 = raw.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    let bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    if (kind === 'z') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    const data = JSON.parse(new TextDecoder().decode(bytes));
    if (data.k === 'dinner') {
      document.title = data.t + ' · Dinner Menu';
      m.innerHTML = `<h1>${esc(data.t)}</h1><div class="orn">✦ ✦ ✦</div>` +
        data.c.map(([course, dish, pours]) => `<div class="course"><div class="cname">${esc(course)}</div>${dish ? `<b>${esc(dish)}</b>` : ''}${pours.map((x) => `<span>${esc(x)}</span>`).join('')}</div>`).join('');
      return;
    }
    document.title = data.t + ' · Cocktail Menu';
    m.innerHTML = `<h1>${esc(data.t)}</h1><div class="orn">✦ ✦ ✦</div><p class="hint">Tap a drink to choose it.</p>` +
      data.d.map(([n, d, z], i) => `<button class="drink" data-i="${i}"><b>${esc(n)}</b>${z ? '<em class="zp">zero proof</em>' : ''}<span>${esc(d)}</span></button>`).join('');
    const pick = document.getElementById('pick');
    let chosen = '';
    m.querySelectorAll('.drink').forEach((b) => b.addEventListener('click', () => {
      chosen = data.d[b.dataset.i][0];
      document.getElementById('pickName').textContent = chosen;
      pick.hidden = false;
    }));
    document.getElementById('back').onclick = () => { pick.hidden = true; };
    document.getElementById('tell').onclick = async () => {
      const text = `I'd love a ${chosen}, please!`;
      try { if (navigator.share) return await navigator.share({ text }); } catch (e) { return; }
      location.href = 'sms:?&body=' + encodeURIComponent(text);
    };
  } catch (e) {
    m.innerHTML = '<h1>Cocktail Menu</h1><p class="err">This menu link looks incomplete. Ask your host to send it again.</p>';
  }
})();
</script>
</body>
</html>
