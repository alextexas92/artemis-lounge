<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1020">
<title>Cocktail Menu</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500&display=swap">
<style>
  :root { --bg:#1b1020; --text:#f4ece0; --muted:#bba9b8; --gold:#d4b25c; --line:#4a3052; --panel:#26162c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Inter",-apple-system,system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:calc(36px + env(safe-area-inset-top)) 20px 60px; text-align:center; }
  h1 { font-family:"Cormorant Garamond",Georgia,serif; color:var(--gold); font-size:2.4rem; font-weight:600; letter-spacing:.06em; margin:0; }
  .orn { color:var(--gold); opacity:.7; margin:6px 0 26px; letter-spacing:.4em; }
  .hint { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  button.drink { display:block; width:100%; background:none; border:0; border-top:1px solid var(--line); color:inherit; padding:18px 6px; cursor:pointer; text-align:center; font:inherit; }
  button.drink:last-of-type { border-bottom:1px solid var(--line); }
  .drink b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.6rem; font-weight:600; }
  .drink span { color:var(--muted); font-size:.95rem; }
  .drink.soft b { font-size:1.3rem; }
  .sec { font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:26px 0 6px; text-align:center; }
  .drink .zp { display:table; margin-left:auto !important; margin-right:auto !important; font-style:normal; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:1px 8px; margin:2px 0 6px; }
  .pick { position:fixed; inset:0; background:rgba(10,5,12,.92); display:flex; align-items:center; justify-content:center; padding:24px; }
  .pick[hidden] { display:none; }
  .pick div { background:var(--panel); border:1px solid var(--gold); border-radius:18px; padding:28px 22px; max-width:420px; width:100%; }
  .pick b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:2.2rem; color:var(--gold); margin:6px 0 10px; }
  .btn { display:inline-block; margin:8px 4px 0; padding:11px 18px; border-radius:12px; border:1px solid var(--gold); background:var(--gold); color:#1b1020; font-weight:600; font:inherit; cursor:pointer; }
  .btn.ghost { background:none; color:var(--gold); }
  .course { border-top:1px solid var(--line); padding:18px 6px; }
  .course:last-of-type { border-bottom:1px solid var(--line); }
  .course .cname { color:var(--gold); font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
  .course b { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.5rem; font-weight:600; margin-bottom:6px; }
  .course span { display:block; color:var(--muted); font-size:.95rem; }
  .err { color:var(--muted); margin-top:40px; }
  /* Art deco dress: a framed card, a sunburst crest, diamond rules between sections */
  html { background:var(--bg); }
  body { background: radial-gradient(ellipse 120% 600px at top, #2d1834 0%, var(--bg) 100%) no-repeat, var(--bg); min-height:100vh; padding:1px 0; }
  main { position:relative; margin:22px max(16px, calc((100% - 540px) / 2)) 30px; border:1px solid var(--gold); outline:1px solid rgba(212,178,92,.35); outline-offset:6px; border-radius:4px; padding:calc(30px + env(safe-area-inset-top)) 22px 40px; max-width:540px; }
  main::before, main::after { content:"◆"; position:absolute; left:50%; transform:translateX(-50%); color:var(--gold); background:var(--bg); padding:0 10px; font-size:.8rem; }
  main::before { top:-.65rem; } main::after { bottom:-.65rem; }
  .fan { display:block; width:110px; margin:0 auto 10px; color:var(--gold); opacity:.85; }
  .rule { display:block; width:220px; max-width:70%; margin:10px auto 22px; color:var(--gold); opacity:.8; }
  .dot { display:block; width:14px; margin:0 auto; color:var(--gold); opacity:.6; }
  h1 { font-size:2.6rem; text-transform:uppercase; letter-spacing:.12em; }
  .sec { display:flex; align-items:center; gap:12px; font-family:"Cormorant Garamond",Georgia,serif; font-size:1.05rem; letter-spacing:.3em; margin:30px 0 4px; }
  .sec::before, .sec::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .sec::after { background:linear-gradient(90deg, var(--gold), transparent); }
  button.drink, button.drink:last-of-type, .course, .course:last-of-type { border:0; }
  button.drink { padding:14px 6px 10px; }
  .drink b { font-size:1.7rem; letter-spacing:.02em; }
  .drink span { font-style:italic; }
  .cheers { font-family:"Cormorant Garamond",Georgia,serif; color:var(--gold); font-style:italic; font-size:1.2rem; margin-top:26px; opacity:.9; }
</style>
</head>
<body>
<main id="m"><p class="err">Loading menu…</p></main>
<div class="pick" id="pick" hidden><div><span class="hint">Your pick</span><b id="pickName"></b><p class="hint">Show this to your host.</p>
  <button class="btn" id="tell">Text my pick</button><button class="btn ghost" id="back">Back to menu</button></div></div>
<script>
(async function () {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const m = document.getElementById('m');
  const FAN = '<svg class="fan" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><line x1="60" y1="56" x2="106.4" y2="43.6"/><line x1="60" y1="56" x2="101.6" y2="32.0"/><line x1="60" y1="56" x2="93.9" y2="22.1"/><line x1="60" y1="56" x2="84.0" y2="14.4"/><line x1="60" y1="56" x2="72.4" y2="9.6"/><line x1="60" y1="56" x2="60.0" y2="8.0"/><line x1="60" y1="56" x2="47.6" y2="9.6"/><line x1="60" y1="56" x2="36.0" y2="14.4"/><line x1="60" y1="56" x2="26.1" y2="22.1"/><line x1="60" y1="56" x2="18.4" y2="32.0"/><line x1="60" y1="56" x2="13.6" y2="43.6"/><path d="M8 56 A52 52 0 0 1 112 56"/><path d="M24 56 A36 36 0 0 1 96 56"/></g><circle cx="60" cy="56" r="4" fill="currentColor"/></svg>';
  const RULE = '<svg class="rule" viewBox="0 0 240 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1"><line x1="0" y1="8" x2="96" y2="8"/><line x1="144" y1="8" x2="240" y2="8"/><path d="M104 8 L110 2 L116 8 L110 14 Z"/><path d="M124 8 L130 2 L136 8 L130 14 Z"/></g><circle cx="120" cy="8" r="2.5" fill="currentColor"/></svg>';
  const DOT = '<svg class="dot" viewBox="0 0 20 10" aria-hidden="true"><path d="M10 0 L13 5 L10 10 L7 5 Z" fill="currentColor"/></svg>';
  try {
    const raw = location.hash.slice(1);
    const kind = raw[0];
    const b64 = raw.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    let bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    if (kind === 'z') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    const data = JSON.parse(new TextDecoder().decode(bytes));
    if (data.k === 'dinner') {
      document.title = data.t + ' · Dinner Menu';
      m.innerHTML = `${FAN}<h1>${esc(data.t)}</h1>${RULE}` +
        data.c.map(([course, dish, pours], i) => `${i ? DOT : ''}<div class="course"><div class="cname">${esc(course)}</div>${dish ? `<b>${esc(dish)}</b>` : ''}${pours.map((x) => `<span>${esc(x)}</span>`).join('')}</div>`).join('') + `${RULE}<div class="cheers">Cheers</div>`;
      return;
    }
    document.title = data.t + ' · Cocktail Menu';
    m.innerHTML = `${FAN}<h1>${esc(data.t)}</h1>${RULE}<p class="hint">Tap a drink to choose it.</p>` +
      data.d.map(([n, d, z, st], i) => {
        // Section headings follow the order drinks are served, when the link has them
        const head = data.s && st != null && (i === 0 || data.d[i - 1][3] !== st) ? `<div class="sec">${esc(data.s[st])}</div>` : '';
        const dot = !head && i ? DOT : '';
        return `${head}${dot}<button class="drink" data-i="${i}"><b>${esc(n)}</b>${z ? '<em class="zp">zero proof</em>' : ''}<span>${esc(d)}</span></button>`;
      }).join('') +
      (data.n && data.n.length ? `<div class="sec">Also available</div>` + data.n.map((n, i) => `${i ? DOT : ''}<button class="drink soft" data-n="${esc(n)}"><b>${esc(n)}</b></button>`).join('') : '') +
      `${RULE}<div class="cheers">Cheers</div>`;
    const pick = document.getElementById('pick');
    let chosen = '';
    m.querySelectorAll('.drink').forEach((b) => b.addEventListener('click', () => {
      chosen = b.dataset.n || data.d[b.dataset.i][0];
      document.getElementById('pickName').textContent = chosen;
      pick.hidden = false;
    }));
    document.getElementById('back').onclick = () => { pick.hidden = true; };
    document.getElementById('tell').onclick = async () => {
      const text = `I'd love ${/^[aeiou]/i.test(chosen) ? 'an' : 'a'} ${chosen}, please!`;
      try { if (navigator.share) return await navigator.share({ text }); } catch (e) { return; }
      location.href = 'sms:?&body=' + encodeURIComponent(text);
    };
  } catch (e) {
    m.innerHTML = '<h1>Cocktail Menu</h1><p class="err">This menu link looks incomplete. Ask your host to send it again.</p>';
  }
})();
</script>
</body>
</html>
